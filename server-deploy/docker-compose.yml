services:
  lieguoji-server:
    build:
      context: ..
      dockerfile: server-deploy/Dockerfile
    container_name: lieguoji-server
    restart: unless-stopped
    ports:
      - "8765:8765/tcp"
      - "443:443/tcp"
      - "8443:8443/tcp"
      - "8767:8767/udp"
    environment:
      LGJ_PORT: "8765"
      LGJ_EXTRA_PORTS: "443,8443"
      LGJ_UDP_PORT: "8767"
      # 4C4G 3Mbps 腾讯云广州轻量云服黄金整形上限（2480 kbps = 310 KB/s，低于 3Mbps 令牌桶杜绝 policer 丢包排队）
      LGJ_MAX_KBPS: "${LGJ_MAX_KBPS:-2480}"
      LGJ_ATLAS_DIR: "/app/HistoricalAtlas"
      LGJ_CATALOG_DIR: "/app"
      LGJ_DATA_DIR: "/data/saves"
      # 设为 1 仅走公网 TCP 毫秒直连（推荐国内云服务器）；若也希望兼作房间码中转，改为 0 并填写 LGJ_PAIRING_CODE
      LGJ_DISABLE_RELAY: "1"
      LGJ_PAIRING_CODE: "ECZV5UL3UV"
    volumes:
      - ./saves:/data/saves

  lieguoji-platform:
    build:
      context: ./platform
      dockerfile: Dockerfile
    container_name: lieguoji-platform
    restart: unless-stopped
    ports:
      - "80:8080/tcp"
    environment:
      LGJ_PLATFORM_PORT: "8080"
      LGJ_PLATFORM_DATA: "/data"
      LGJ_PUBLIC_HOST: "${LGJ_PUBLIC_HOST:-111.230.153.235}"
      LGJ_COMPUTE_HOST: "${LGJ_COMPUTE_HOST:-111.230.153.235:8765}"
      LGJ_COMPUTE_PROBE_HOST: "172.17.0.1"
      LGJ_COMPUTE_PROBE_PORT: "8765"
    volumes:
      - ./platform-data:/data
