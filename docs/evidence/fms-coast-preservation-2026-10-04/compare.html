<!doctype html>
<html lang="zh-CN"><meta charset="utf-8"><title>V5 海岸保形本地对照</title>
<style>body{margin:0;background:#eee9dc;color:#34474e;font:16px system-ui}header{padding:14px 22px}h1{font-size:22px;margin:0 0 6px}p{margin:5px 0}main{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:0 18px 18px}article{background:#3c5d6c;color:#efe9d4}h2{font-size:16px;margin:0;padding:9px 14px}.map{height:340px;position:relative}.map canvas{display:block}#result{white-space:pre-wrap;font:13px monospace;padding:0 22px 20px}</style>
<header><h1>生成内陆，固定原海岸</h1><p>同一输入、相机与种子；左为原高程，右为候选。仅本地工程对照，不代表原作或手机验收。</p></header>
<main id="maps"></main><div id="result">计算中</div>
<script type="module">
import { FmsRenderer } from '/src/fms/renderer.ts';
import { naturalizeFmsTerrain } from '/src/fms/naturalize.ts';
import { coastFixture, compareLinearCoasts } from '/tests/helpers/fms-coast-metrics.ts';
const evidence=[];
for(const kind of ['neck','island']){
  const source=coastFixture(kind), result=naturalizeFmsTerrain(source,{seed:42,strength:1});
  const metric=compareLinearCoasts(source,result.elevations,kind==='island'?40:200);evidence.push({kind,...metric});
  for(const [title,doc] of [['原图',source],['候选',{...source,elevations:result.elevations}]]){
    const card=document.createElement('article'),heading=document.createElement('h2'),host=document.createElement('div');
    heading.textContent=(kind==='neck'?'单行采样细颈':'单采样小岛')+' · '+title;host.className='map';card.append(heading,host);document.querySelector('#maps').append(card);
    const renderer=new FmsRenderer();await renderer.init(host);renderer.setDocument(doc);
    const scale=kind==='island'?14:1.5,cx=kind==='island'?40:200,cy=kind==='island'?40:270;
    renderer.setCamera({x:host.clientWidth/2-cx*scale,y:host.clientHeight/2-cy*scale,scale});
  }
}
document.querySelector('#result').textContent=evidence.map(m=>`${m.kind}: 海岸交点 ${m.crossingCount}；最大位移 ${m.maxCrossingDisplacement}；面积 ${m.landAreaBefore.toFixed(4)} → ${m.landAreaAfter.toFixed(4)}；截线 ${JSON.stringify(m.sectionBefore)} → ${JSON.stringify(m.sectionAfter)}`).join('\n');
window.coastEvidence=evidence;
</script></html>
