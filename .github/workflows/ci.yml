name: CI

# Tests run locally before each release (npm run check). The GitHub run is
# manual only (Actions tab → Run workflow), e.g. when billing allows it.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and unit checks
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      CI: 'true'
      VITEST_MAX_WORKERS: '1'
    outputs:
      dist-digest: ${{ steps.dist.outputs.digest }}
    steps:
      - name: Check out tested revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1; verified in docs/GITHUB_WORKFLOW.md
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0; verified in docs/GITHUB_WORKFLOW.md
        with:
          node-version: '24.18.1'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Record tested revision
        run: git rev-parse HEAD

      - name: Install locked dependencies
        run: npm ci

      - name: Lint, types, unit tests and production build
        run: npm run check:full

      - name: Record checked build digest
        id: dist
        shell: bash
        run: |
          digest=$(cd dist && find . -type f -print0 | LC_ALL=C sort -z | xargs -0 sha256sum | sha256sum | cut -d ' ' -f 1)
          echo "digest=$digest" >> "$GITHUB_OUTPUT"

  browser:
    name: Browser / ${{ matrix.project }} / ${{ matrix.shard }}
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      CI: 'true'
    strategy:
      fail-fast: false
      matrix:
        project: [desktop-chromium, mobile-chromium, tablet-chromium]
        shard: [1, 2]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24.18.1'
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - name: Build the same revision without artifact storage
        run: npm run build
      - name: Verify build matches the unit-check job
        shell: bash
        env:
          EXPECTED_DIGEST: ${{ needs.build.outputs.dist-digest }}
        run: |
          git rev-parse HEAD
          digest=$(cd dist && find . -type f -print0 | LC_ALL=C sort -z | xargs -0 sha256sum | sha256sum | cut -d ' ' -f 1)
          test -n "$EXPECTED_DIGEST" && test "$digest" = "$EXPECTED_DIGEST"
      - run: npx playwright install --with-deps chromium
      - name: Run every browser test in this project and shard
        run: npm run test:e2e -- --project=${{ matrix.project }} --shard=${{ matrix.shard }}/2 --workers=1
      - name: Keep browser evidence
        id: evidence
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1; verified in docs/GITHUB_WORKFLOW.md
        with:
          name: browser-${{ matrix.project }}-${{ matrix.shard }}-${{ github.sha }}-${{ github.run_attempt }}
          path: |
            playwright-report/
            test-results/
          if-no-files-found: warn
          retention-days: 1
          include-hidden-files: false

      - name: Warn when downloadable evidence is unavailable
        if: always() && steps.evidence.outcome == 'failure'
        run: echo '::warning::Browser evidence upload failed. Read results in the job log; downloadable traces and screenshots may be unavailable.'

  checks:
    name: Application checks
    needs: [build, browser]
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - name: Require both the build and every browser shard
        env:
          BUILD_RESULT: ${{ needs.build.result }}
          BROWSER_RESULT: ${{ needs.browser.result }}
        run: test "$BUILD_RESULT" = success && test "$BROWSER_RESULT" = success
