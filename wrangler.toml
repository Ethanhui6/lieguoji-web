# Cloudflare Pages：只承载 iOS 版「电脑计算」的中转函数（functions/api/relay）。
# 中转房间是 lieguoji-relay Worker（relay/wrangler.toml）里的 Durable Object。
# 网页版已停止更新，线上保留最后一次部署。
name = "lieguoji-web"
compatibility_date = "2026-09-01"

[[durable_objects.bindings]]
name = "ROOMS"
class_name = "Room"
script_name = "lieguoji-relay"
