name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, codex/ph06-world-generation]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Application checks
    runs-on: ubuntu-24.04
    timeout-minutes: 60 # Full 156-browser suite; individual test and product thresholds stay unchanged.
    env:
      CI: 'true'
    steps:
      - name: Check out tested revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1; verified in docs/GITHUB_WORKFLOW.md
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0; verified in docs/GITHUB_WORKFLOW.md
        with:
          node-version: '24.18.1'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Record tested revision
        run: git rev-parse HEAD

      - name: Install locked dependencies
        run: npm ci

      - name: Check plan, lint, types, unit tests, and production build
        run: npm run build:cf

      - name: Install Chromium and system dependencies
        run: npx playwright install --with-deps chromium

      - name: Run core browser checks
        run: npm run test:e2e

      - name: Keep checked game build
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1; verified in docs/GITHUB_WORKFLOW.md
        with:
          name: game-dist-${{ github.sha }}
          path: dist/
          if-no-files-found: error
          retention-days: 7
          include-hidden-files: false

      - name: Keep browser failure evidence
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1; verified in docs/GITHUB_WORKFLOW.md
        with:
          name: browser-failure-${{ github.sha }}-${{ github.run_attempt }}
          path: |
            playwright-report/
            test-results/
          if-no-files-found: warn
          retention-days: 7
          include-hidden-files: false
