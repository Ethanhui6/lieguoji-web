name: LieguojiNative
options:
  deploymentTarget:
    iOS: "17.0"
packages:
  LieguojiCore:
    path: Core
settings:
  base:
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "1,2"
targets:
  LieguojiNative:
    type: application
    platform: iOS
    sources:
      - App
      - Render
      # Folder reference: the bundle keeps World/world.bin and World/world.json together.
      - path: Resources/World
        type: folder
        buildPhase: resources
    dependencies:
      - package: LieguojiCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.lieguoji.native
        MARKETING_VERSION: "0.2.0"
        CURRENT_PROJECT_VERSION: "2"
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: 列国纪·原生
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CADisableMinimumFrameDurationOnPhone: true
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
