name: LieguojiNative
options:
  deploymentTarget:
    iOS: "17.0"
packages:
  LieguojiCore:
    path: Core
settings:
  base:
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "1,2"
targets:
  LieguojiNative:
    type: application
    platform: iOS
    sources:
      - App
      - Render
      # Folder reference: the bundle keeps World/world.bin and World/world.json together.
      - path: Resources/World
        type: folder
        buildPhase: resources
      # TW-Kai (the original's map font, as the web ships it), converted from the web's woff2 subset to TrueType.
      - path: Resources/Fonts
        type: folder
        buildPhase: resources
      # The web game's engine (src/native-bridge, built by vite.bridge.config.ts), hosted invisibly.
      - path: Resources/Engine
        type: folder
        buildPhase: resources
    dependencies:
      - package: LieguojiCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.lieguoji.native
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        MARKETING_VERSION: "0.9.3"
        CURRENT_PROJECT_VERSION: "12"
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: 列国纪
        UIUserInterfaceStyle: Light
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CADisableMinimumFrameDurationOnPhone: true
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
