name: LieguojiNative
options:
  deploymentTarget:
    iOS: "17.0"
packages:
  LieguojiCore:
    path: Core
settings:
  base:
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "1,2"
targets:
  LieguojiNative:
    type: application
    platform: iOS
    sources:
      - App
      - Render
      # Folder reference: the bundle keeps World/world.bin and World/world.json together.
      - path: Resources/World
        type: folder
        buildPhase: resources
      # TW-Kai（全字库正楷体，© 2018 台湾国家发展委员会，政府资料开放授权第1版）：GB2312 全部汉字 + 网页与原生名称目录用字的子集。
      - path: Resources/Fonts
        type: folder
        buildPhase: resources
      # Name catalogues and character traits for the Swift engine.
      - path: Resources/Catalog
        type: folder
        buildPhase: resources
      # The web game's engine (src/native-bridge, built by vite.bridge.config.ts), hosted invisibly.
      - path: Resources/Engine
        type: folder
        buildPhase: resources
      # The original's five RandomMusicPlayer tracks (AAC, as the web build ships them).
      - path: Resources/Music
        type: folder
        buildPhase: resources
    dependencies:
      - package: LieguojiCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.lieguoji.native
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        MARKETING_VERSION: "1.5.0"
        CURRENT_PROJECT_VERSION: "103"
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: 列国纪
        UIUserInterfaceStyle: Light
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CADisableMinimumFrameDurationOnPhone: true
        NSLocalNetworkUsageDescription: 远程计算需要连接同一局域网里运行列国纪服务器的电脑，由电脑推演世界、手机显示画面。
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
