name: iOS Native unsigned IPA
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  core-linux:
    runs-on: ubuntu-latest
    container: swift:5.10
    steps:
      - uses: actions/checkout@v4
      - run: swift test --package-path ios-native/Core
  archive:
    needs: core-linux
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Core tests
        run: swift test --package-path ios-native/Core
      - name: Generate project
        run: |
          brew install xcodegen
          cd ios-native
          xcodegen generate
      - name: Archive unsigned application
        run: |
          xcodebuild -project ios-native/LieguojiNative.xcodeproj -scheme LieguojiNative -configuration Release -destination 'generic/platform=iOS' -archivePath ios-native/build/LieguojiNative.xcarchive CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO archive
      - name: Package
        run: |
          mkdir -p ios-native/build/Payload
          cp -R ios-native/build/LieguojiNative.xcarchive/Products/Applications/*.app ios-native/build/Payload/
          ditto -c -k --keepParent ios-native/build/Payload ios-native/build/lieguoji-native-stage1-unsigned.ipa
      - uses: actions/upload-artifact@v4
        with:
          name: lieguoji-native-stage1-unsigned
          path: ios-native/build/lieguoji-native-stage1-unsigned.ipa
          if-no-files-found: error
          retention-days: 14
