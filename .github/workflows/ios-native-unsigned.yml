name: iOS Native unsigned IPA
on:
  workflow_dispatch:
    inputs:
      run_tests:
        description: 'Run Linux Core swift test suite'
        type: boolean
        default: false
      run_screenshots:
        description: 'Run iOS Simulator screenshot tour'
        type: boolean
        default: false
      run_server_windows:
        description: 'Build Windows remote server'
        type: boolean
        default: false
  push:
    branches: ['main', 'claude/native-*']
    paths:
      - 'ios-native/**'
      - '.github/workflows/ios-native-unsigned.yml'
  pull_request:
    paths:
      - 'ios-native/**'
      - '.github/workflows/ios-native-unsigned.yml'
permissions:
  contents: write
jobs:
  core-linux:
    if: github.event_name == 'pull_request' || (github.event_name == 'workflow_dispatch' && inputs.run_tests)
    runs-on: ubuntu-latest
    container: swift:5.10
    steps:
      - uses: actions/checkout@v4
      # Optimized build: the golden tests replay large run states through the JS model.
      - run: swift test -c release -Xswiftc -enable-testing --package-path ios-native/Core
      - run: swift build -c release --product LieguojiServer --package-path ios-native/Core
  # 远程计算服务器 for Windows: only built on manual workflow_dispatch when requested.
  server-windows:
    if: github.event_name == 'workflow_dispatch' && inputs.run_server_windows
    # Swift 5.10 cannot build against the current MSVC headers; 6.1 can (the package stays in Swift 5 mode).
    runs-on: windows-2022
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: compnerd/gha-setup-swift@main
        with:
          branch: swift-6.1.2-release
          tag: 6.1.2-RELEASE
      - name: Build server
        run: swift build -c release --product LieguojiServer --package-path ios-native/Core
      - name: Package with the Swift runtime
        shell: pwsh
        run: |
          $out = "server/列国纪远程计算"
          New-Item -ItemType Directory -Force $out | Out-Null
          $exe = Get-ChildItem -Recurse ios-native/Core/.build -Filter LieguojiServer.exe | Where-Object { $_.FullName -match 'release' } | Select-Object -First 1
          Copy-Item $exe.FullName $out/
          $core = (where.exe swiftCore.dll | Select-Object -First 1)
          $rt = Split-Path $core
          Get-ChildItem $rt -Filter *.dll | ForEach-Object { Copy-Item $_.FullName $out/ }
          $readme = @"
          列国纪远程计算服务器
          1. 双击 LieguojiServer.exe（首次运行若弹出 Windows 防火墙提示，选择允许专用网络）。
          2. 窗口里会显示这台电脑的地址，例如 192.168.1.20:8765。
          3. 手机与电脑连同一个 Wi-Fi，在手机游戏「菜单 › 远程计算」填入地址并连接。
          4. 连接后推演由电脑完成，手机只负责画面；关闭窗口即停止，手机会自动切回本机计算。
          端口被占用时，可在命令行运行：LieguojiServer.exe 8766
          "@
          Set-Content -Path "$out/使用说明.txt" -Value $readme -Encoding utf8
      - uses: actions/upload-artifact@v4
        with:
          name: lieguoji-server-windows
          path: server
          if-no-files-found: error
          retention-days: 14
  archive:
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Generate project
        run: |
          brew install xcodegen
          cd ios-native
          xcodegen generate
      - name: Validate embedded Metal shader
        run: |
          python3 - <<'PY'
          from pathlib import Path
          render = Path('ios-native/Render')
          parts = [('MapRenderer.swift', 'shaders'), ('Wash.swift', 'sweepShaders'), ('Ink.swift', 'shaders')]
          shader = '\n'.join((render / file).read_text(encoding='utf-8').split(f'static let {key} = """', 1)[1].split('"""', 1)[0]
                             for file, key in parts)
          Path('/tmp/lieguoji-map.metal').write_text(shader, encoding='utf-8')
          PY
          xcrun -sdk iphoneos metal -c /tmp/lieguoji-map.metal -o /tmp/lieguoji-map.air
      - name: Archive unsigned application
        run: |
          xcodebuild -project ios-native/LieguojiNative.xcodeproj -scheme LieguojiNative -configuration Release -destination 'generic/platform=iOS' -archivePath ios-native/build/LieguojiNative.xcarchive CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO archive
      - name: Read version and release notes
        id: meta
        run: |
          python3 - <<'PY'
          import os, re
          from pathlib import Path

          yml = Path('ios-native/project.yml').read_text(encoding='utf-8')
          ver_m = re.search(r'MARKETING_VERSION:\s*"([^"]+)"', yml)
          bld_m = re.search(r'CURRENT_PROJECT_VERSION:\s*"([^"]+)"', yml)
          version = ver_m.group(1) if ver_m else '0.0.0'
          build = bld_m.group(1) if bld_m else '0'
          ipa_name = f"lieguoji-{version}-build{build}-unsigned.ipa"
          artifact_name = f"lieguoji-{version}-build{build}-unsigned"

          changelog = Path('CHANGELOG.md').read_text(encoding='utf-8')
          sections = re.split(r'(?m)^(?=## )', changelog)
          notes = ''
          for sec in sections:
              if sec.startswith(f'## {version}'):
                  notes = sec.strip()
                  break
          if not notes:
              for sec in sections:
                  if sec.startswith('## '):
                      notes = sec.strip()
                      break
          if not notes:
              notes = f"## {version} / build {build}\n\n- 列国纪 iOS 原生未签名构建包。"

          Path('/tmp/release-notes.md').write_text(notes + '\n', encoding='utf-8')
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as out:
              out.write(f"version={version}\n")
              out.write(f"build={build}\n")
              out.write(f"ipa_name={ipa_name}\n")
              out.write(f"artifact_name={artifact_name}\n")
          PY
      - name: Package
        run: |
          mkdir -p ios-native/build/Payload
          cp -R ios-native/build/LieguojiNative.xcarchive/Products/Applications/*.app ios-native/build/Payload/
          ditto -c -k --keepParent ios-native/build/Payload "ios-native/build/${{ steps.meta.outputs.ipa_name }}"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.meta.outputs.artifact_name }}
          path: ios-native/build/${{ steps.meta.outputs.ipa_name }}
          if-no-files-found: error
          retention-days: 14
      - name: Write Chinese summary and publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${{ steps.meta.outputs.version }}"
          BUILD="${{ steps.meta.outputs.build }}"
          IPA_NAME="${{ steps.meta.outputs.ipa_name }}"
          IPA_PATH="ios-native/build/${IPA_NAME}"
          {
            echo "# 列国纪 iOS 原生版 v${VERSION}（构建 ${BUILD}）"
            echo ""
            echo "- 安装包：\`${IPA_NAME}\`"
            echo "- 提交：\`${GITHUB_SHA::8}\`"
            echo ""
            cat /tmp/release-notes.md
          } >> "$GITHUB_STEP_SUMMARY"

          if [ "${GITHUB_REF}" = "refs/heads/main" ]; then
            TAG="v${VERSION}"
            TITLE="列国纪 v${VERSION}（构建 ${BUILD}）"
            if gh release view "${TAG}" >/dev/null 2>&1; then
              gh release edit "${TAG}" --title "${TITLE}" --notes-file /tmp/release-notes.md --latest
              gh release upload "${TAG}" "${IPA_PATH}" --clobber
            else
              gh release create "${TAG}" "${IPA_PATH}" --title "${TITLE}" --notes-file /tmp/release-notes.md --latest --target "${GITHUB_SHA}"
            fi
          fi
  screenshots:
    # The app tours itself in the simulator (LGJ_SHOT=1); manual dispatch only so pushes ship IPA fast.
    if: github.event_name == 'workflow_dispatch' && inputs.run_screenshots
    runs-on: macos-26
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - name: Generate project
        run: |
          brew install xcodegen
          cd ios-native
          xcodegen generate
      - name: Build for the simulator
        run: |
          xcodebuild -project ios-native/LieguojiNative.xcodeproj -scheme LieguojiNative -configuration Release -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' -derivedDataPath ios-native/build/sim "ARCHS=$(uname -m)" CODE_SIGNING_ALLOWED=NO build > sim-build.log 2>&1             || { grep -E "error:|fatal error|Segmentation|Stack dump" -A4 sim-build.log | head -80; tail -20 sim-build.log; exit 1; }
          tail -5 sim-build.log
      - name: Tour and screenshot
        run: |
          set -x
          APP=$(find ios-native/build/sim/Build/Products -name '*.app' -maxdepth 2 | head -1)
          UDID=$(xcrun simctl list devices available -j | python3 -c "import json,sys;d=json.load(sys.stdin)['devices'];c=[x for k,v in d.items() if 'iOS' in k for x in v if x['name'].startswith('iPhone')];p=[x for x in c if 'Pro' in x['name'] and 'Max' not in x['name']];print((p or c)[-1]['udid'])")
          xcrun simctl boot "$UDID"; xcrun simctl bootstatus "$UDID" -b
          xcrun simctl install "$UDID" "$APP"
          DATA=$(xcrun simctl get_app_container "$UDID" com.lieguoji.native data)
          # The generated CI world must stay on this simulator, not attach to the player's computer.
          mkdir -p "$DATA/Library/Preferences"
          /usr/libexec/PlistBuddy -c 'Add :remote.autoAll bool false' "$DATA/Library/Preferences/com.lieguoji.native.plist"
          /usr/libexec/PlistBuddy -c 'Print :remote.autoAll' "$DATA/Library/Preferences/com.lieguoji.native.plist"
          launched=$(SIMCTL_CHILD_LGJ_SHOT=1 xcrun simctl launch "$UDID" com.lieguoji.native)
          echo "$launched"
          pid=${launched##*: }
          mkdir -p shots; end=$((SECONDS+1500)); finished=0
          while [ $SECONDS -lt $end ] && [ $finished = 0 ]; do
            if [[ "$pid" =~ ^[0-9]+$ ]] && ! kill -0 "$pid" 2>/dev/null; then
              echo "::error::列国纪在模拟器巡览期间退出"
              xcrun simctl spawn "$UDID" log show --last 3m --predicate 'process == "LieguojiNative"' --style compact | tail -30 || true
              break
            fi
            for f in "$DATA"/Documents/shot-*.ready; do
              [ -e "$f" ] || continue
              n=$(basename "$f" .ready); n=${n#shot-}
              # 视频片段标记：立即消费标记，避免无头虚拟机后台 recordVideo 占用 simctl io 管道或阻塞步骤退出。
              case "$n" in
                rec-*-start|rec-*-stop) rm -f "$f"; continue ;;
              esac
              sleep 0.6
              [ "$n" = done ] && finished=1 || xcrun simctl io "$UDID" screenshot "shots/$n.png"
              rm -f "$f"
            done
            sleep 0.4
          done
          xcrun simctl io "$UDID" screenshot shots/zz-last.png || true
          [ "$finished" = 1 ] && printf '{"finished":true}\n' > shots/tour-status.json || printf '{"finished":false}\n' > shots/tour-status.json
          for name in founding-time.json wash-demo.json name-stability.json color-contrast.json map-unrolled.json advance-ownership.json ci-control-world.lgj ci-control-tuning.json panel-profile.json ci-panel-world.lgj war-rule-settings.json; do
            [ ! -f "$DATA/Documents/$name" ] || cp "$DATA/Documents/$name" shots/
          done
          node scripts/check-native-tour.mjs shots || {
            xcrun simctl spawn "$UDID" log show --last 30m --predicate 'eventMessage CONTAINS "Lieguoji Metal:"' --style compact | tail -12 || true
            xcrun simctl shutdown "$UDID" || true
            exit 1
          }
          xcrun simctl shutdown "$UDID" || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lieguoji-screenshots
          path: shots
          retention-days: 14
