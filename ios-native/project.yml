name: LieguojiNative
options:
  deploymentTarget:
    iOS: "17.0"
packages:
  LieguojiCore:
    path: Core
settings:
  base:
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "1,2"
targets:
  LieguojiNative:
    type: application
    platform: iOS
    sources:
      - App
      - Render
      # Folder reference: the bundle keeps World/world.bin and World/world.json together.
      - path: Resources/World
        type: folder
        buildPhase: resources
      # 工笔水墨舆图地标、古罗盘玫瑰与战神／诏书徽记（透明 PNG，轻量高精）
      - path: Resources/Art
        type: folder
        buildPhase: resources
      # TW-Kai（全字库正楷体，统一全站唯一字族；未使用的 3.3MB 额外字库与 43MB 音乐/视频/旧网页引擎已移至腾讯云按需流式下载与游戏内热更包）
      - path: Resources/Fonts/TW-Kai.ttf
        buildPhase: resources
      # Name catalogues and character traits for the Swift engine.
      - path: Resources/Catalog
        type: folder
        buildPhase: resources
      # 轻量化古风交互音效包（落印、翻卷、拔锚、行军、刀兵、火炮、传报，仅 120KB，离在线即刻响起）
      - path: Resources/Audio
        type: folder
        buildPhase: resources
      # Natural Earth 1:10m 真实地理高程底图、10 大史实国界掩膜与 4200 座真实中文城市志
      - path: Resources/HistoricalAtlas
        type: folder
        buildPhase: resources
    dependencies:
      - package: LieguojiCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.lieguoji.native
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        MARKETING_VERSION: "9.0.0"
        CURRENT_PROJECT_VERSION: "193"
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: 列国纪
        UIUserInterfaceStyle: Light
        UIDesignRequiresCompatibility: true
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CADisableMinimumFrameDurationOnPhone: true
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
        NSLocalNetworkUsageDescription: 远程计算需要连接同一局域网里运行列国纪服务器的电脑，由电脑推演世界、手机显示画面。
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        UILaunchScreen:
          UIColorName: LaunchPaper
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
